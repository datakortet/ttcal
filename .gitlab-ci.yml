
include:
  - project: 'norsktest/dktools'
    file: '/ci-templates/dkbuild.yml'


deploy_code:
  stage: deploy
  image: norsktest/dktestpackage311@sha256:35101d73e12bd6bab6e9cdbb12229e9ea2b58a288f75d51a9b525258784ebb14
  before_script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$DEPLOY_PKEY")
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - dk pkg
    - ssh -v deploy@fischer.datakortet.c.bitbit.net "cd /srv/lib/core/ttcal && git pull"
  environment:
    name: production
    url: https://admin.datakortet.no/userenv/
  when: manual
  only:
    - master
    - pushes
    - web
