
include:
  - project: 'norsktest/dktools'
    file: '/ci-templates/dkbuild.yml'


deploy_code:
  stage: deploy
  image: norsktest/dktestpackage312@sha256:af9f4003be3ecab1ab1ec5fa7e4cd50a08d6b20f1e5be1962406b7d0d296eb31
  before_script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$DEPLOY_PKEY")
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - dk pkg
    - ssh -v deploy@geralt.datakortet.c.bitbit.net "cd /srv/lib/core/ttcal && git pull"
  environment:
    name: production
    url: https://admin.datakortet.no/userenv/
  when: manual
  only:
    - master
    - pushes
    - web
